<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>early AI</title>
<style>
:root{--ink:#070f18;--panel:rgba(13,30,48,.72);--line:#1a3652;--text:#d9ecf7;--dim:#6f8ba3;--glow:#2de2ff;--warn:#ffb454;--red:#ff4d5e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 0,#0d2236 0,var(--ink) 60%);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
header .t{flex:1;min-width:0}header b{font-size:17px;letter-spacing:.42em;font-weight:600}
header small{display:block;color:var(--dim);font-size:10px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;letter-spacing:.16em;color:var(--glow);border:1px solid var(--glow);border-radius:99px;padding:3px 10px;white-space:nowrap}
#stop{background:rgba(255,77,94,.12);color:var(--red);border:1px solid var(--red);border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;letter-spacing:.1em}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;overflow-y:auto;padding:10px 12px}.view.on{display:block}
#log{flex-direction:column;gap:8px}#log.on{display:flex}
.stage{position:relative;height:clamp(230px,40vh,380px)}
#holo{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px rgba(45,226,255,.45))}
#state{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.5em;color:var(--text);padding-left:.5em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.wide{grid-column:1/-1}
.card{position:relative;background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.card::before,.card::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--glow)}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.card h5{margin:0 0 8px;font-size:11px;letter-spacing:.22em;color:var(--glow);font-weight:600}
.big{font-size:38px;font-weight:300;line-height:1;letter-spacing:.02em}.big sup{font-size:15px;color:var(--glow);margin-left:3px}
#dateline{margin-top:8px;font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
#gauges{display:flex;justify-content:space-between;gap:4px}
.rg{position:relative;width:52px;text-align:center}.rg svg{width:52px;height:52px}
.r0,.r1{fill:none;stroke-width:3.5}.r0{stroke:var(--line)}.r1{stroke:var(--glow);stroke-linecap:round}
.rg b{position:absolute;top:16px;left:0;right:0;font-size:11px;font-weight:600}.rg small{font-size:10px;letter-spacing:.14em;color:var(--dim)}
.row2{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid rgba(26,54,82,.6)}.row2 span:first-child{color:var(--dim)}
.prov{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.prov span{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.prov i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;background:var(--dim)}.prov .ok i{background:var(--glow);box-shadow:0 0 6px var(--glow)}
#live{font-size:14px;color:var(--text);min-height:40px;white-space:pre-wrap}
.m{max-width:88%;padding:8px 12px;border-radius:4px;white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--line)}
.m small{display:block;font-size:10px;letter-spacing:.16em;color:var(--dim);margin-bottom:3px}
.u{align-self:flex-end;background:#10354a;border-color:#1c5675}.z{align-self:flex-start;background:var(--panel)}
.s{align-self:center;color:var(--dim);font-size:12px;border:0}.z.auto{border-color:var(--glow);background:#0d2c36}
#mind{font-size:14px}#mind h4{margin:14px 0 6px;color:var(--glow);font-size:11px;letter-spacing:.22em;font-weight:600}
#mind .t{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:6px 0;color:var(--dim)}#mind .t i{color:var(--text);font-style:normal}
.bar{height:5px;background:var(--line);overflow:hidden}.bar>div{height:100%;background:var(--glow);transition:width .6s}
#cam{display:none;width:100%;max-height:150px;object-fit:cover;border-top:1px solid var(--line)}
#confirm{display:none;margin:0 12px 8px;padding:12px;border:1px solid var(--warn);background:#2a2112}#confirm p{margin:0 0 10px;word-break:break-all}
.row{display:flex;gap:8px}
button.b{flex:1;padding:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
button.go{background:var(--glow);color:#04202a;border-color:var(--glow);font-weight:600}button.no{background:none}
#mic.live{background:var(--red);border-color:var(--red);color:#fff}
footer{padding:6px 12px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);background:rgba(7,15,24,.9)}
footer input{width:100%;padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#chips button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:5px 11px;font:inherit;font-size:12px}
nav{display:flex;border-top:1px solid var(--line)}
nav button{flex:1;padding:11px 4px;border:0;border-top:2px solid transparent;background:none;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
nav button.on{color:var(--glow);border-top-color:var(--glow)}
button:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
dialog{background:#0d1d2e;color:var(--text);border:1px solid var(--line);width:min(92vw,420px)}
dialog input[type=password],dialog select{width:100%;margin:6px 0 12px;padding:10px;border:1px solid var(--line);background:var(--ink);color:var(--text);font:inherit}
dialog input[type=range]{width:100%;margin:6px 0 12px}dialog label{display:block;font-size:14px}dialog::backdrop{background:rgba(0,0,0,.65)}dialog small{color:var(--dim)}
#inner div{color:var(--dim);font-size:13px;margin-bottom:4px}#inner div:first-child{color:var(--text)}
.dv{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;color:var(--dim);margin-top:5px}.dv span{width:64px}.dv .bar{flex:1}
#route{position:absolute;top:6px;left:8px;font-size:11px;letter-spacing:.06em;color:var(--glow);border:1px solid var(--line);background:rgba(7,15,24,.7);padding:2px 8px;z-index:2}
.ag{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(26,54,82,.5)}.ag em{font-style:normal;color:var(--dim)}.ag .working{color:var(--glow)}.ag .completed{color:#6dffb0}.ag .failed{color:var(--red)}
.chipm{display:inline-block;border:1px solid var(--line);padding:5px 10px;margin:0 6px 6px 0;font-size:12px;letter-spacing:.1em;background:var(--panel);color:var(--text)}.chipm.on{border-color:var(--glow);color:var(--glow)}
.pv input{width:100%;margin:6px 0;padding:8px;border:1px solid var(--line);background:var(--ink);color:var(--text);font:inherit}
#imgPrev{display:none;align-items:center;gap:8px}#imgPrev img{height:44px;border:1px solid var(--glow)}#imgPrev button{border:1px solid var(--line);background:none;color:var(--text);padding:2px 8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px}.dot.ok{background:#6dffb0}.dot.bad{background:var(--red)}
#vTasks textarea{width:100%;min-height:64px;padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
pre.out{white-space:pre-wrap;word-wrap:break-word;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:280px;overflow:auto;margin:6px 0;color:var(--text)}
.ev{font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--dim)}
#pal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9;padding:14vh 12px 0}#pal>div{max-width:420px;margin:auto;background:#0d1d2e;border:1px solid var(--glow)}
#pal input{width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:inherit}#pal button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;color:var(--text);font:inherit}#pal button:hover,#pal button.sel{background:#12334a}
nav button{letter-spacing:.06em;font-size:10px}
@media (orientation:landscape) and (max-height:600px){
body{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"nav hdr" "nav main" "nav foot";padding:0 env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0)}
header{grid-area:hdr;padding:3px 10px}header b{font-size:13px}header small{display:none}.pill{padding:2px 8px;font-size:10px}#stop{padding:3px 8px}
main{grid-area:main}
nav{grid-area:nav;flex-direction:column;border-top:0;border-right:1px solid var(--line)}
nav button{flex:1;border-top:0;border-left:2px solid transparent;padding:2px;font-size:9px;letter-spacing:.04em}
nav button.on{border-left-color:var(--glow)}
footer{grid-area:foot;flex-direction:row;align-items:center;gap:8px;padding:4px 10px}#chips{display:none}footer input#txt{flex:1;min-width:0;padding:7px 10px}footer .row{flex:none;width:56%}
#cam{grid-area:main;justify-self:end;align-self:end;width:30%;max-height:100px;z-index:3}
#confirm{grid-area:main;align-self:end;z-index:4;margin:0 8px 6px}
#vHome.on{display:grid;grid-template-columns:minmax(150px,34%) 1fr;gap:12px;align-items:start}
#vHome .stage{height:calc(100dvh - 90px);min-height:120px;position:sticky;top:0}#vHome .grid{margin-top:0}
#state{font-size:10px}.big{font-size:28px}
.view{padding:6px 10px}
button.b{padding:7px 4px;font-size:13px}
dialog{max-height:92dvh;overflow-y:auto}
.m{max-width:70%}
#pal{padding-top:4vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html[data-theme=arc]{--ink:#050c16;--panel:rgba(10,26,44,.78);--line:#1a4a6e;--glow:#2de2ff;--rgb:45,226,255;--a2:#ffc233}
body{background:radial-gradient(90% 55% at 50% 0,rgba(var(--rgb),.22) 0,transparent 70%),linear-gradient(rgba(var(--rgb),.05) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(var(--rgb),.05) 1px,transparent 1px) 0 0/34px 34px,var(--ink)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.65) 100%)}
header{background:linear-gradient(90deg,rgba(var(--rgb),.18),transparent 70%);border-bottom:1px solid var(--glow);box-shadow:0 2px 18px rgba(var(--rgb),.35)}

@keyframes gl{0%,90%,100%{transform:none;text-shadow:0 0 10px rgba(var(--rgb),.9)}92%{transform:translate(2px,-1px);text-shadow:-3px 0 var(--a2),3px 0 var(--glow)}95%{transform:translate(-2px,1px);text-shadow:3px 0 var(--a2),-3px 0 var(--glow)}}
.pill{box-shadow:0 0 10px rgba(var(--rgb),.5),inset 0 0 8px rgba(var(--rgb),.25);animation:pl 2s infinite}@keyframes pl{50%{box-shadow:0 0 18px rgba(var(--rgb),.9),inset 0 0 8px rgba(var(--rgb),.4)}}
.card{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));background:linear-gradient(135deg,rgba(var(--rgb),.14),var(--panel) 45%);box-shadow:inset 0 0 22px rgba(var(--rgb),.14);border-color:rgba(var(--rgb),.55)}
.card h5{text-shadow:0 0 8px rgba(var(--rgb),.8)}
.stage::before{content:"";position:absolute;left:50%;top:46%;width:min(78vw,310px);aspect-ratio:1;margin:calc(min(78vw,310px)/-2) 0 0 calc(min(78vw,310px)/-2);border-radius:50%;background:conic-gradient(from 0deg,transparent 0,rgba(var(--rgb),.38) 10%,transparent 11%);animation:sp 3.6s linear infinite;pointer-events:none;-webkit-mask:radial-gradient(circle,transparent 38%,#000 39%);mask:radial-gradient(circle,transparent 38%,#000 39%)}
.stage::after{content:"";position:absolute;left:50%;top:46%;width:min(88vw,350px);aspect-ratio:1;margin:calc(min(88vw,350px)/-2) 0 0 calc(min(88vw,350px)/-2);border-radius:50%;border:2px dashed rgba(var(--rgb),.45);animation:sp 18s linear infinite reverse;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
#holo{position:relative;z-index:1;filter:drop-shadow(0 0 16px rgba(var(--rgb),.85))}
#state{z-index:2;color:var(--glow);text-shadow:0 0 10px var(--glow);font-weight:700}
button.b,#chips button,.chipm{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);border-color:rgba(var(--rgb),.6);text-transform:uppercase;letter-spacing:.08em}
button.go{background:linear-gradient(135deg,var(--glow),var(--a2));color:#050505;box-shadow:0 0 18px rgba(var(--rgb),.7);animation:pl 2.4s infinite}
nav{background:rgba(0,0,0,.55);border-top:1px solid var(--glow);box-shadow:0 -2px 18px rgba(var(--rgb),.3)}
nav button.on{background:linear-gradient(0deg,rgba(var(--rgb),.28),transparent);text-shadow:0 0 8px var(--glow)}
footer{background:rgba(0,0,0,.65)}footer input{border-color:rgba(var(--rgb),.7);box-shadow:inset 0 0 12px rgba(var(--rgb),.18)}
.u{background:rgba(var(--rgb),.16);border-color:rgba(var(--rgb),.6)}.z{border-left:3px solid var(--glow)}.z.auto{background:rgba(var(--rgb),.1)}
#stop{box-shadow:0 0 10px rgba(255,77,94,.6)}#route{border-color:var(--glow);box-shadow:0 0 8px rgba(var(--rgb),.5);z-index:3}
dialog,#pal>div{background:var(--ink);border-color:var(--glow);box-shadow:0 0 30px rgba(var(--rgb),.5)}
.r1{filter:drop-shadow(0 0 4px var(--glow))}.big{text-shadow:0 0 14px rgba(var(--rgb),.8);font-weight:600}

<body>
<header><div class="t"><b>early AI</b><small>ALTREX core · <span id="chipMood">calm</span> · <span id="chipAuto">mind ON</span></small></div><button id="themeBtn" class="pill" style="background:none" title="Interface badlo">◐</button><button id="palBtn" class="pill" style="background:none">⌘</button><span id="pill" class="pill">● READY</span><button id="stop">STOP</button><span id="clock" hidden></span></header>
<main>
<section id="vHome" class="view on">
  <div class="stage"><span id="route">AUTO</span><canvas id="holo"></canvas><span id="state">READY</span></div>
  <div class="grid">
    <div class="card"><h5>LOCAL TIME</h5><div class="big" id="bigclock"></div><div id="dateline"></div></div>
    <div class="card"><h5>SYSTEM</h5><div id="gauges"></div></div>
    <div class="card wide"><h5>CONTEXT</h5>
      <div class="row2"><span>Voice</span><span>Browser · hi-IN</span></div>
      <div class="row2"><span>Internet</span><span id="net"></span></div>
      <div class="row2"><span>Camera</span><span id="camst">off</span></div>
      <div class="prov" id="prov"></div></div>
    <div class="card wide"><h5>INNER MIND</h5><div id="inner"><div>Jaag rahi hoon...</div></div><div id="drives"></div></div>
    <div class="card wide"><h5>LIVE ACTION</h5><div id="live">No active task</div></div>
  </div>
</section>
<div id="log" class="view" aria-live="polite"></div>
<div id="mind" class="view"></div>
<div id="vTasks" class="view"></div>
<div id="vAi" class="view"></div>
</main>
<video id="cam" playsinline muted></video>
<div id="confirm"><p id="cq"></p><div class="row"><button class="b go" id="yes">Haan</button><button class="b no" id="no">Na</button></div></div>
<footer>
  <div id="chips"></div>
  <div id="imgPrev"></div>
  <input id="txt" placeholder="Talk to early AI, or type a command..." enterkeyhint="send" autocomplete="off">
  <div class="row"><button class="b go" id="mic">Mic</button><button class="b" id="send">Send</button><button class="b" id="camBtn">Camera</button><button class="b" id="imgBtn">Photo</button><input type="file" id="imgIn" accept="image/*" hidden></div>
</footer>
<nav><button class="on" data-t="home">Home</button><button data-t="chat">Chat</button><button data-t="tasks">Tasks</button><button data-t="ai">AI</button><button data-t="mind">Mind</button><button id="keysBtn">Settings</button></nav>
<div id="pal"><div><input id="palIn" placeholder="Command..." autocomplete="off"><div id="palList"></div></div></div>
<dialog id="dlg">
  <b>API keys</b><br><small>Sirf is phone ke browser mein save hoti hain. Kahin aur nahi bheji jaatin, sirf Groq/Gemini ko.</small>
  <label>GROQ_API_KEY<input id="kg" type="password" autocomplete="off"></label>
  <label>GEMINI_API_KEY<input id="kk" type="password" autocomplete="off"></label>
  <label>Apne aap sochna (autonomy)<select id="sAuto"><option value="0">Band</option><option value="400">Kam (7 min)</option><option value="120">Normal (2 min)</option><option value="45">Zyada (45 sec)</option></select></label>
  <label>Mazaak (humor): <span id="vH"></span><input id="sHum" type="range" min="0" max="10"></label>
  <label>Bolne ki zaroorat (proactivity): <span id="vP"></span><input id="sPro" type="range" min="0" max="10"></label>
  <label>Awaaz / Character<select id="sPers"><option value="f">early AI (ladki)</option><option value="m">early AI (ladka, khatarnak awaaz)</option></select></label>
  <label>Awaaz ki type<select id="sVoice"><option value="f">Ladki wali awaaz</option><option value="m">Ladke wali awaaz</option></select></label>
  <label><input id="sHands" type="checkbox"> Hands-free (bolne ke baad khud sunta rahe)</label><br>
  <div class="row"><button class="b go" id="ksave">Save</button><button class="b" id="kmem">Memory saaf</button><button class="b no" id="kclose">Band</button></div>
</dialog>
<dialog id="hdlg"><b style="letter-spacing:.2em">HISTORY</b><div id="hlist" style="margin:10px 0;max-height:50vh;overflow:auto"></div><div class="row"><button class="b" id="hclear">Sab delete</button><button class="b go" id="hclose">Band</button></div></dialog>

function droneOn(){try{if(drone)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const g=AC.createGain();g.gain.value=0;g.connect(AC.destination);const o1=AC.createOscillator(),o2=AC.createOscillator();o1.type="sawtooth";o1.frequency.value=48;o2.type="sine";o2.frequency.value=96.7;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=220;o1.connect(f);o2.connect(f);f.connect(g);o1.start();o2.start();g.gain.linearRampToValueAtTime(.05,AC.currentTime+.4);drone={g,o1,o2}}catch(e){}}
function droneOff(){try{if(!drone)return;const d=drone;drone=null;d.g.gain.linearRampToValueAtTime(0,AC.currentTime+.5);setTimeout(()=>{try{d.o1.stop();d.o2.stop()}catch(e){}},700)}catch(e){}}
function pickVoice(M){const all=SS?SS.getVoices():[],v=all.filter(x=>x.lang.startsWith("hi"));return M?(v.find(x=>/male|madhur|hemant|prabhat|ravi|rishi/i.test(x.name)&&!/female/i.test(x.name))||all.find(x=>/en-IN|en-GB|en-US/.test(x.lang)&&/male|ravi|rishi|daniel|james|guy|david|mark|alex/i.test(x.name)&&!/female/i.test(x.name))||v[0]):(v.find(x=>/female|lekha|swara|neerja|kalpana|heera/i.test(x.name))||v[0])}
function speak(t){
  if(!SS||!window.SpeechSynthesisUtterance)return;
  SS.cancel();const M=S.voice==="m",D=S.persona==="m",voice=pickVoice(M);
  const parts=D?(t.match(/[^.!?…]+[.!?…]*/g)||[t]).map(x=>x.trim()).filter(Boolean):[t];
  const fin=()=>{droneOff();setState("","Taiyaar");if(S.hands&&!document.hidden)setTimeout(listen,500)};
  const run=i=>{
    if(i>=parts.length){fin();return}
    const u=new SpeechSynthesisUtterance(parts[i]);u.lang="hi-IN";u.volume=1;
    if(D){u.rate=M?.72:.76;u.pitch=M?.2:.3}else{u.rate=1.05;u.pitch=M?.8:1.15}
    if(voice)u.voice=voice;
    u.onstart=()=>{setState("speak","Bol raha hoon");if(D)droneOn()};
    u.onend=()=>{if(D&&i<parts.length-1)setTimeout(()=>run(i+1),420+Math.random()*250);else run(i+1)};
    u.onerror=()=>{droneOff()};
    SS.speak(u);setTimeout(()=>{if(mode==="think")setState("","")},2500)};
  run(0);
}
function say(t){add("z",t);$("live").textContent=t;speak(t.length>300?t.slice(0,300):t)}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function listen(){
  if(!SR){add("s","Is browser mein mic recognition nahi hai. Chrome use karo.");return}
  (SS&&SS.cancel());
  rec=new SR();rec.lang="hi-IN";rec.interimResults=false;
  rec.onstart=()=>{setState("listen","Sun raha hoon...");$("mic").classList.add("live")};

  rec.onend=()=>{$("mic").classList.remove("live");if(mode==="listen"){setState("","Taiyaar");if(S.hands)setTimeout(listen,400)}};
  rec.start();
}

/* ===== Hologram avatar: triangulated mesh head on projector base ===== */
(()=>{
const cv=$("holo"),g=cv.getContext("2d");let W=0,H=300,dpr=1;
function fit(){dpr=window.devicePixelRatio||1;const cw=cv.clientWidth,ch=cv.clientHeight;if(!cw||!ch)return;const sc=ch/300;cv.width=cw*dpr;cv.height=ch*dpr;W=cw/sc;g.setTransform(dpr*sc,0,0,dpr*sc,0,0)}
addEventListener("resize",fit);fit();
const RX=58,RY=80,RZ=52,D=Math.PI/180;let C="45,226,255";
let gx=0,gy=0,tgx=0,tgy=0,lastPtr=0,blink=0,nb=2,mouth=0,yaw=0,T=0,prev=performance.now();
addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();tgx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(innerWidth/2)));tgy=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/(innerHeight/2)));lastPtr=performance.now()});
const LA=[],LO=[];for(let a=-80;a<=84;a+=12)LA.push(a*D);for(let o=-100;o<=100;o+=13)LO.push(o*D);
function P(lon,lat,cy){const tp=lat<0?1-.3*Math.pow(-lat/1.5708,1.5):1,x=RX*tp*Math.cos(lat)*Math.sin(lon),y=-RY*Math.sin(lat),z=RZ*tp*Math.cos(lat)*Math.cos(lon),cs=Math.cos(yaw),sn=Math.sin(yaw);return{x:W/2+x*cs+z*sn,y:cy+y,z:-x*sn+z*cs}}
function line(pts,a,w){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.strokeStyle=`rgba(${C},${a})`;g.lineWidth=w||1;g.stroke()}
function ell(x,y,rx,ry,a,w){g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.strokeStyle=`rgba(${C},${a})`;g.lineWidth=w||1;g.stroke()}
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;T+=dt;Mood.step(dt);C=THEME_RGB||Mood.rgb;
  const idle=now-lastPtr>3000;
  if(idle){tgx=Math.sin(T*.45)*.6;tgy=Math.sin(T*.31)*.25}
  if(mode==="think"){tgx=.7;tgy=-.6}else if(mode==="listen"&&idle){tgx=0;tgy=0}
  gx+=(tgx-gx)*Math.min(1,dt*5);gy+=(tgy-gy)*Math.min(1,dt*5);yaw=gx*.35+Math.sin(T*.6)*.05;
  nb-=dt;if(nb<0){blink=.14;nb=2+Math.random()*3}if(blink>0)blink-=dt;
  const bl=(blink>0?Math.abs(blink-.07)/.07:1)*Mood.lid;
  const tm=mode==="speak"?(.25+.75*Math.abs(Math.sin(T*13))*(.5+.5*Math.sin(T*5.3+1))):0;mouth+=(tm-mouth)*Math.min(1,dt*18);
  const cy=H*.36+Math.sin(T*1.4)*1.5,top=cy+RY*.8,base=H-38;
  g.clearRect(0,0,W,H);g.lineCap="round";g.shadowBlur=0;
  // projector cone + base
  let gr=g.createLinearGradient(0,top,0,base);gr.addColorStop(0,`rgba(${C},.04)`);gr.addColorStop(1,`rgba(${C},.42)`);
  g.beginPath();g.moveTo(W/2-28,top);g.quadraticCurveTo(W/2-36,top+40,W/2-70,base);g.lineTo(W/2+70,base);g.quadraticCurveTo(W/2+36,top+40,W/2+28,top);g.closePath();g.fillStyle=gr;g.fill();
  for(let k=1;k<6;k++){const y=top+(base-top)*k/6,w=28+42*k/6;line([{x:W/2-w,y},{x:W/2+w,y}],.16,1)}
  g.beginPath();g.ellipse(W/2,base,70,13,0,0,7);g.fillStyle=`rgba(${C},.28)`;g.fill();ell(W/2,base,70,13,.8,1.5);ell(W/2,base+2,90,17,.45);
  g.setLineDash([5,7]);g.lineDashOffset=-T*10;ell(W/2,base+4,118,23,.4);g.setLineDash([]);
  // head glow fill
  gr=g.createRadialGradient(W/2,cy-12,6,W/2,cy,RY);gr.addColorStop(0,`rgba(${C},.30)`);gr.addColorStop(1,`rgba(${C},.06)`);
  g.beginPath();g.ellipse(W/2,cy+2,RX*Math.cos(yaw*.6),RY,0,0,7);g.fillStyle=gr;g.fill();
  // triangulated mesh
  const G=LA.map(la=>LO.map(lo=>P(lo,la,cy))),B=[[],[],[]];
  for(let i=0;i<LA.length-1;i++)for(let j=0;j<LO.length-1;j++){
    const a=G[i][j],b=G[i][j+1],c=G[i+1][j],d=G[i+1][j+1];if(a.z<-RZ*.25)continue;
    const f=(a.z+RZ)/(2*RZ),k=f<.45?0:f<.7?1:2;B[k].push([a,b],[a,c],[a,d])}
  [.14,.34,.7].forEach((al,k)=>{g.beginPath();B[k].forEach(([p,q])=>{g.moveTo(p.x,p.y);g.lineTo(q.x,q.y)});g.strokeStyle=`rgba(${C},${al})`;g.lineWidth=.9;g.stroke()});
  // face
  const fr=p=>p.z>0;
  for(const sd of[-1,1]){
    const ex=sd*.36,ey=.14,b0=P(ex-.14,ey+.2+Mood.brow*.05,cy),b1=P(ex+.14,ey+.22-sd*Mood.brow*.05,cy);if(fr(b0)&&fr(b1))line([b0,b1],.8,2);
    const e=P(ex+gx*.08,ey-gy*.06,cy);if(!fr(e))continue;
    g.shadowColor=`rgba(${C},1)`;g.shadowBlur=14;g.beginPath();g.ellipse(e.x,e.y,10,Math.max(.8,4.5*bl),0,0,7);g.fillStyle="rgba(225,255,255,.97)";g.fill();g.shadowBlur=0}
  const n0=P(0,.1,cy),n1=P(0,-.2,cy);if(fr(n1))line([n0,n1],.45,1.2);
  const up=[],lo=[];for(let k=-4;k<=4;k++){const lon=k*.07,cv2=(.01+Mood.smile*.03)*(k*k/16);up.push(P(lon,-.45+cv2-.01,cy));lo.push(P(lon,-.45+cv2-.01-mouth*.17,cy))}
  if(fr(up[4])){line(up,.75,1.8);if(mouth>.06){line(lo,.7,1.5);g.beginPath();up.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));lo.slice().reverse().forEach(p=>g.lineTo(p.x,p.y));g.closePath();g.fillStyle=`rgba(${C},.25)`;g.fill()}}
  // scan band + listening rings
  const sy=((T*(mode==="think"?160:55))%(H+60))-30;gr=g.createLinearGradient(0,sy-20,0,sy+20);gr.addColorStop(0,`rgba(${C},0)`);gr.addColorStop(.5,`rgba(${C},.2)`);gr.addColorStop(1,`rgba(${C},0)`);g.fillStyle=gr;g.fillRect(0,sy-20,W,40);
  if(mode==="listen")for(let i=0;i<2;i++){const r=((T*.8+i*.5)%1);ell(W/2,cy,RX+25+r*55,RY+15+r*45,.4*(1-r),1.2)}
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
})();
