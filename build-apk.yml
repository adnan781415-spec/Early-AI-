name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Add storage plugin and permissions
        run: |
          P=android/app/src/main
          mkdir -p $P/java/com/earlyai/app
          cp AllFilesPlugin.java MainActivity.java $P/java/com/earlyai/app/
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = ["READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE", "MANAGE_EXTERNAL_STORAGE",
                   "READ_MEDIA_IMAGES", "READ_MEDIA_VIDEO", "READ_MEDIA_AUDIO",
                   "RECORD_AUDIO", "CAMERA", "MODIFY_AUDIO_SETTINGS", "INTERNET"]
          add = "".join('    <uses-permission android:name="android.permission.%s" />\n' % x
                        for x in perms if 'android.permission.%s"' % x not in s)
          if "requestLegacyExternalStorage" not in s:
              s = s.replace("<application", '<application android:requestLegacyExternalStorage="true"', 1)
          s = s.replace("<application", add + "    <application", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")
          PY
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: early-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
